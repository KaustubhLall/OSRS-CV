<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OSRSEvents Dashboard</title>
    <!-- Include Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <!-- Include JSONEditor CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/jsoneditor@9.5.6/dist/jsoneditor.min.css">
    <style>
        body {
            padding-top: 20px;
        }
        .container {
            max-width: 100%;
        }
        .json-data {
            height: 600px; /* Adjust as needed */
        }
    </style>
</head>
<body>
<div class="container">
    <h1>OSRSEvents Dashboard</h1>
    <table class="table table-bordered table-striped table-responsive">
        <thead>
        <tr>
            <th style="width: 15%;">Event Type</th>
            <th style="width: 15%;">Event Timestamp</th>
            <th style="width: 20%;">Received At</th>
            <th style="width: 50%;">Data</th>
        </tr>
        </thead>
        <tbody>
        {% for event in events %}
            <tr>
                <td>{{ event.event_type }}</td>
                <td>{{ event.timestamp | datetimeformat }}</td>
                <td>{{ event.received_at.strftime('%Y-%m-%d %H:%M:%S') }}</td>
                <td>
                    <div id="json-viewer-{{ event.id }}" class="json-data"></div>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

<!-- Include jQuery and Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<!-- Include JSONEditor JS -->
<script
        src="https://cdn.jsdelivr.net/npm/jsoneditor@9.5.6/dist/jsoneditor.min.js"></script>

<script>
    {% for event in events %}
    (function() {
        var container = document.getElementById('json-viewer-{{ event.id }}');
        var options = {
            mode: 'view',
            modes: ['view', 'code', 'text', 'tree', 'form'],
            navigationBar: false,
            statusBar: false
        };
        var jsonData = {{ event.data | tojson }};
        var editor = new JSONEditor(container, options);
        editor.set(jsonData);
    })();
    {% endfor %}

    // Auto-refresh the page every 10 seconds
    setInterval(function(){
        window.location.reload();
    }, 10000); // Refresh every 10 seconds
</script>
</body>
</html>
